services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ragdb}
      POSTGRES_USER: ${DB_USER:-rag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rag} -d ${DB_NAME:-ragdb}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
