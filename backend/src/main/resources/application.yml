app:
  rag:
    top-k: 5
    similarity-threshold: 0.55
spring:
  application:
    name: rag-assistant

  # Loads ../.env or ./.env (git-ignored) so nobody has to export env vars by hand.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:ragdb}
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update          # schema generated by Hibernate (dev). Entities own the schema.
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    openai:
      # Placeholder default so the app still boots for people not working on AI.
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
    vectorstore:
      pgvector:
        initialize-schema: true      # creates the vector_store table + index
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1536}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.ai: INFO
    org.hibernate.SQL: DEBUG
